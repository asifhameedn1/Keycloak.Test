<header class="border-b border-gray-200">
  <nav class="mx-auto flex max-w-4xl items-center gap-6 px-4 py-3">
    <a routerLink="/" class="font-semibold">keycloak.testApp</a>
    <a routerLink="/profile" routerLinkActive="text-blue-600">Profile</a>
    <a routerLink="/admin" routerLinkActive="text-blue-600">Admin</a>

    <div class="ml-auto flex items-center gap-4">
      @if (auth.authenticated()) {
        <span class="text-sm text-gray-600">{{ auth.displayName() }}</span>
        <button
          type="button"
          class="rounded border border-gray-300 px-3 py-1 text-sm hover:bg-gray-100"
          (click)="auth.logout()"
        >
          Sign out
        </button>
      } @else {
        <button
          type="button"
          class="rounded bg-blue-600 px-3 py-1 text-sm text-white hover:bg-blue-700"
          (click)="auth.login()"
        >
          Sign in
        </button>
      }
    </div>
  </nav>
</header>

@if (auth.initError(); as error) {
  <div class="bg-red-50 px-4 py-2 text-center text-sm text-red-700" role="alert">{{ error }}</div>
}

<main class="mx-auto max-w-4xl px-4 py-8">
  <router-outlet />
</main>
